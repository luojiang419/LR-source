plugins { id 'com.android.application' }
// Windows 的非 ASCII 项目路径会影响 JDK 17 测试 worker 的类路径解析；构建产物统一落在仓库 ASCII 缓存目录。
layout.buildDirectory.set(rootProject.file(providers.gradleProperty('inventoryBuildDir').getOrElse('../build/inventory-android/app')))
def privateConfig = new Properties()
def privateFile = rootProject.file('ocr.local.properties')
if (privateFile.exists()) privateFile.withInputStream { privateConfig.load(it) }
def literal = { value -> '"' + value.toString().replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.framekeep.inventory'
    compileSdk 35
    defaultConfig {
        applicationId 'com.framekeep.inventory'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        if (providers.gradleProperty('inventoryAbi').isPresent()) { ndk { abiFilters providers.gradleProperty('inventoryAbi').get() } }
        buildConfigField 'String', 'OCR_URL', literal(privateConfig.getProperty('url', ''))
        buildConfigField 'String', 'OCR_MODEL', literal(privateConfig.getProperty('model', 'glm-ocr'))
        buildConfigField 'String', 'OCR_KEY', literal(privateConfig.getProperty('key', ''))
        testInstrumentationRunner providers.gradleProperty('inventoryTestRunner').getOrElse('androidx.test.runner.AndroidJUnitRunner')
        manifestPlaceholders = [appLabel:'SHIYING 库存管理']
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/paddle-assets'))
    testBuildType providers.gradleProperty('inventoryTestBuildType').getOrElse('debug')
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes {
        verification { initWith debug; applicationIdSuffix '.verification'; matchingFallbacks=['debug']; manifestPlaceholders=[appLabel:'SHIYING 库存管理验证'] }
        // 内部交付沿用本机开发签名以便无损更新；对外发布应改用独立保管的正式签名。
        release { signingConfig signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'; testProguardFiles 'proguard-android-test.pro' }
    }
}
tasks.register('preparePaddleModels', Exec) {
    inputs.files(rootProject.file('tools/prepare_paddle_models.py'),rootProject.file('tools/paddle-models.json'))
    outputs.dir(layout.buildDirectory.dir('generated/paddle-assets'))
    commandLine 'python','-X','utf8',rootProject.file('tools/prepare_paddle_models.py').absolutePath,'--output',layout.buildDirectory.dir('generated/paddle-assets').get().asFile.absolutePath
}
tasks.named('preBuild').configure { dependsOn 'preparePaddleModels' }
dependencies {
    implementation project(':paddle-ocr')
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
