<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>末帧选片</title><link rel="stylesheet" href="startup.css"><script src="startup-visual.js" defer></script><script src="desktop.js" defer></script><script src="startup.js" defer></script></head>
<body class="startup-host">
<section id="startup-screen" class="startup-screen" data-step="0" aria-label="正在打开末帧">
  <div class="startup-signature"><b>F.</b><span>FRAMEKEEP</span></div>
  <div class="startup-composition">
    <img class="startup-art" src="startup.svg" width="420" height="280" alt="" aria-hidden="true">
    <h1 class="startup-wordmark">末帧</h1><p class="startup-subtitle">MOMENTS, KEPT.</p>

    <div class="startup-steps" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p id="error" class="startup-error"></p>
  </div>
  <p class="startup-note">叠帧 · 对焦 · 留下最后一帧</p>
</section>
</body></html>
