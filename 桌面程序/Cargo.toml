[package]
name = "framekeep-desktop"
version = "1.0.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.7.1"
tauri-plugin-single-instance = "=2.4.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "=1.26.0", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Foundation"] }
png = "=0.17.16"
base64 = "=0.22.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
