<div id="ocr-motion-preview" data-theme="dark" data-phase="running">
  <div class="om-toolbar">

  </div>
  <div class="om-stage">
    <div class="om-photo" aria-label="款号标签示意图"><div class="om-seam"></div><div class="om-tag"><span>7877538</span><span>341-D</span><span>00413</span></div></div>

        <defs><linearGradient id="om-scan-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity="0"/><stop offset="1" stop-color="currentColor" stop-opacity=".22"/></linearGradient><clipPath id="om-scan-clip"><rect x="10" y="10" width="32" height="32" rx="4"/></clipPath></defs>
        <path class="om-corners" d="M18 7H12a5 5 0 0 0-5 5v6M34 7h6a5 5 0 0 1 5 5v6M45 34v6a5 5 0 0 1-5 5h-6M18 45h-6a5 5 0 0 1-5-5v-6"/>
        <g class="om-reading" clip-path="url(#om-scan-clip)">
          <path class="om-glyphs" d="M15 16h6m4 0h12M15 23h12m4 0h6M15 30h5m4 0h13M15 37h12m4 0h6"/>
          <g class="om-sweep"><rect x="10" y="-4" width="32" height="17" fill="url(#om-scan-fill)"/><path d="M11 13h30"/></g>

      <div class="om-copy"><strong>款号识别中<span class="om-dots">···</span></strong><small>正在读取标签并匹配拍摄文档</small></div>

  <div class="om-controls" aria-label="演示任务状态">
    <button type="button" data-phase="running" aria-pressed="true">识别中</button><button type="button" data-phase="success" aria-pressed="false">匹配成功</button><button type="button" data-phase="review" aria-pressed="false">待确认</button><button type="button" data-phase="error" aria-pressed="false">识别失败</button>
    <button type="button" class="om-replay">重播完整过程</button>
  </div>
</div>
<style>
#ocr-motion-preview{--om-bg:#202124;--om-raised:#2a2b2e;--om-text:#eeedeb;--om-muted:#b4b1ad;--om-line:#444345;--om-accent:#d7c6ac;--om-success:#83cda2;--om-warning:#e5c38e;--om-error:#ff9b94;--om-shadow:#0005;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--om-text);background:var(--om-bg);border-radius:14px;overflow:hidden;color-scheme:dark}
#ocr-motion-preview[data-theme="light"]{--om-bg:#faf6ef;--om-raised:#fffcf8;--om-text:#40382f;--om-muted:#786a5b;--om-line:#dfd0bd;--om-accent:#886447;--om-success:#26734d;--om-warning:#8b5e24;--om-error:#b42318;--om-shadow:#694b3826;color-scheme:light}
#ocr-motion-preview[data-theme="pure-white"]{--om-bg:#fff;--om-raised:#f5f6f8;--om-text:#252a32;--om-muted:#697382;--om-line:#d9dfe7;--om-accent:#424c5b;--om-success:#26734d;--om-warning:#8b5e24;--om-error:#b42318;--om-shadow:#29354820;color-scheme:light}
#ocr-motion-preview[data-theme="hardcore"]{--om-bg:#1a1a1a;--om-raised:#222221;--om-text:#f0eee9;--om-muted:#a7a6a2;--om-line:#484846;--om-accent:#f0eee9;--om-success:#72d6a0;--om-warning:#e5c38e;--om-error:#ff8d86;border-radius:3px}
#ocr-motion-preview *{box-sizing:border-box}
#ocr-motion-preview .om-toolbar{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:16px 20px;flex-wrap:wrap;padding-right:96px}
#ocr-motion-preview .om-brand{font-weight:600;letter-spacing:.04em}
#ocr-motion-preview .om-brand span{font-weight:400;color:var(--om-muted);letter-spacing:0}
#ocr-motion-preview label{color:var(--om-muted);display:flex;align-items:center;gap:8px}
#ocr-motion-preview select,#ocr-motion-preview button{font:inherit;color:var(--om-text);background:var(--om-raised);border:1px solid var(--om-line);border-radius:7px;padding:7px 11px}
#ocr-motion-preview .om-stage{height:390px;position:relative;isolation:isolate;overflow:hidden;margin:0 12px;border-radius:8px;background:#243a54}
#ocr-motion-preview .om-photo{position:absolute;inset:0;background:repeating-linear-gradient(125deg,#ffffff05 0 1px,transparent 1px 4px),linear-gradient(130deg,#182c43,#526984 48%,#182a42);overflow:hidden}
#ocr-motion-preview .om-seam{position:absolute;top:-90px;left:20%;width:130px;height:650px;border-left:3px dashed #c8b69088;border-right:3px dashed #c8b69088;box-shadow:inset 12px 0 25px #101d3280,8px 0 20px #101d3280;transform:rotate(-29deg)}
#ocr-motion-preview .om-tag{position:absolute;left:48%;top:43%;transform:translate(-50%,-50%) rotate(-8deg);width:181px;padding:18px 24px;background:#eeeae0;color:#403e39;box-shadow:0 5px 14px #08132355;font:italic 28px/1.6 Georgia,serif;text-align:center}
#ocr-motion-preview .om-tag span{display:block}
#ocr-motion-preview .om-photo-name{position:absolute;left:18px;top:14px;font-size:12px;color:#fff;background:#172435bb;padding:4px 9px;border-radius:5px}
#ocr-motion-preview .om-stars{position:absolute;bottom:16px;left:16px;display:flex;align-items:center;gap:3px;padding:6px 9px;background:var(--om-bg);border:1px solid var(--om-line);border-radius:10px;box-shadow:0 5px 18px var(--om-shadow);isolation:isolate}
#ocr-motion-preview .om-stars button{border:0;background:transparent;font-size:22px;padding:0 2px;color:var(--om-accent);line-height:30px}
#ocr-motion-preview .om-stars>span:not(.om-star-halo){font-size:22px;letter-spacing:2px;color:var(--om-muted);opacity:.5}
#ocr-motion-preview .om-star-halo{position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;color:var(--om-accent);opacity:0}
#ocr-motion-preview[data-phase="running"] .om-star-halo{animation:om-breathe 2.4s ease-in-out infinite}
#ocr-motion-preview[data-phase="running"] .om-second{animation:om-star 2.4s ease-in-out infinite}
#ocr-motion-preview .om-status{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:13px;padding:15px 19px 17px;background:var(--om-bg);border:1px solid var(--om-line);border-radius:14px;box-shadow:0 8px 24px var(--om-shadow);max-width:calc(100% - 32px);overflow:hidden;color:var(--om-accent)}
#ocr-motion-preview .om-scanner{width:44px;height:44px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#ocr-motion-preview .om-glyphs{opacity:.4;stroke-width:2.2;stroke-dasharray:30;animation:om-glyphs 2.4s ease-in-out infinite}
#ocr-motion-preview .om-corners{opacity:.8}
#ocr-motion-preview .om-sweep{animation:om-scan 2.4s cubic-bezier(.4,0,.25,1) infinite}
#ocr-motion-preview .om-copy strong{display:block;font-size:14px;font-weight:500;letter-spacing:.05em;color:var(--om-text)}
#ocr-motion-preview .om-copy small{display:block;margin-top:4px;font-size:12px;color:var(--om-muted)}
#ocr-motion-preview .om-dots{display:inline-block;width:18px;animation:om-star 1.2s ease-in-out infinite}
#ocr-motion-preview .om-trace{position:absolute;bottom:0;left:20px;right:20px;height:2px;background:color-mix(in srgb,var(--om-accent) 12%,transparent);overflow:hidden}
#ocr-motion-preview .om-trace span{display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,var(--om-accent),transparent);animation:om-flow 2.4s ease-in-out infinite}
#ocr-motion-preview .om-tick,#ocr-motion-preview .om-alert{display:none}
#ocr-motion-preview:not([data-phase="running"]) .om-reading,#ocr-motion-preview:not([data-phase="running"]) .om-trace{display:none}
#ocr-motion-preview[data-phase="success"] .om-status{color:var(--om-success)}
#ocr-motion-preview[data-phase="success"] .om-tick{display:block;stroke-dasharray:36;animation:om-check .5s ease-out both;stroke-width:2.4}
#ocr-motion-preview[data-phase="review"] .om-status{color:var(--om-warning)}
#ocr-motion-preview[data-phase="error"] .om-status{color:var(--om-error)}
#ocr-motion-preview[data-phase="review"] .om-alert,#ocr-motion-preview[data-phase="error"] .om-alert{display:block}
#ocr-motion-preview .om-controls{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px}
#ocr-motion-preview .om-controls button{font-size:12px}
#ocr-motion-preview .om-controls [aria-pressed="true"]{border-color:var(--om-accent);color:var(--om-accent)}
#ocr-motion-preview .om-replay{margin-left:auto}
#ocr-motion-preview[data-theme="hardcore"] .om-status,#ocr-motion-preview[data-theme="hardcore"] .om-stars{border-radius:4px;box-shadow:none}
@keyframes om-breathe{0%,100%{opacity:.15;box-shadow:0 0 0 0 currentColor}50%{opacity:.35;box-shadow:0 0 14px 2px currentColor}}
@keyframes om-star{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes om-scan{0%,100%{transform:translateY(0);opacity:.2}15%,75%{opacity:1}85%{transform:translateY(28px);opacity:0}}
@keyframes om-glyphs{0%,100%{opacity:.25}50%{opacity:.75}}
@keyframes om-flow{from{transform:translateX(-100%)}to{transform:translateX(390%)}}
@keyframes om-check{from{stroke-dashoffset:36}to{stroke-dashoffset:0}}
@media(max-width:560px){#ocr-motion-preview .om-toolbar{padding:14px; padding-right:90px;gap:10px}#ocr-motion-preview .om-stage{height:390px}#ocr-motion-preview .om-status{bottom:77px;right:12px;padding:12px 14px;gap:10px}#ocr-motion-preview .om-stars{bottom:14px;left:12px}#ocr-motion-preview .om-tag{top:35%;left:50%}#ocr-motion-preview .om-replay{margin-left:0}}
@media(prefers-reduced-motion:reduce){#ocr-motion-preview *,#ocr-motion-preview *::before{animation:none!important}#ocr-motion-preview .om-star-halo{opacity:.2}#ocr-motion-preview .om-sweep{transform:translateY(14px)}}
</style>
<script>
(()=>{const root=document.getElementById('ocr-motion-preview');let timer;
const copy={running:['款号识别中','正在读取标签并匹配拍摄文档'],success:['已匹配 · 7877538','文档唯一命中 · 已自动应用'],review:['发现多个候选款号','请在 SKU 面板选择正确款号'],error:['暂未识别成功','请检查模型连接或重新识别']};
function phase(value){root.dataset.phase=value;const [title,detail]=copy[value];root.querySelector('.om-copy strong').textContent=title;root.querySelector('.om-copy small').textContent=detail;root.querySelectorAll('[data-phase]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.phase===value)));}
root.querySelector('select').onchange=event=>{root.dataset.theme=event.target.value};
root.querySelectorAll('button[data-phase]').forEach(button=>button.onclick=()=>{clearTimeout(timer);phase(button.dataset.phase)});
function replay(){clearTimeout(timer);phase('running');timer=setTimeout(()=>phase('success'),4200)}
root.querySelector('.om-replay').onclick=replay;root.querySelector('.om-second').onclick=replay;
root.querySelector('.om-stars button').onclick=()=>{clearTimeout(timer);phase('review');root.querySelector('.om-copy strong').textContent='已设为一星';root.querySelector('.om-copy small').textContent='二星可重新触发款号识别'};
phase('running');
})();
</script>
