<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" color="#83bda4" role="img" aria-label="光轨传片：相机与工作台之间的照片传输">
  <style>
    .packet{animation:transfer 5.6s cubic-bezier(.4,0,.2,1) infinite}.packet.second{animation-delay:1.4s}.signal{opacity:.2;animation:signal 5.6s ease-in-out infinite}.receive{opacity:.08;animation:receive 5.6s ease-in-out infinite}
    @keyframes transfer{0%,14%{opacity:0;transform:translateX(-28px)}24%{opacity:.8}66%{opacity:.8}79%,100%{opacity:0;transform:translateX(90px)}}
    @keyframes signal{0%,100%{opacity:.2}28%,42%{opacity:.9}}
    @keyframes receive{0%,55%,100%{opacity:.08}70%,82%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.packet{opacity:.5}}
  </style>
  <circle cx="99" cy="111" r="60" fill="currentColor" fill-opacity=".035"/>
  <path d="M55 84h18l8-12h28l8 12h19a8 8 0 0 1 8 8v48a8 8 0 0 1-8 8H55a8 8 0 0 1-8-8V92a8 8 0 0 1 8-8Z" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5"/>
  <circle cx="96" cy="114" r="23" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5"/>
  <circle cx="96" cy="114" r="14" stroke="currentColor" stroke-opacity=".3"/>
  <circle class="signal" cx="130" cy="95" r="2.5" fill="currentColor"/>
  <path d="M154 114h64" stroke="currentColor" stroke-opacity=".16" stroke-dasharray="2 6"/>
  <g class="packet" stroke="currentColor" stroke-opacity=".8"><rect x="165" y="102" width="18" height="23" rx="3" fill="currentColor" fill-opacity=".08"/><path d="m168 119 4-5 3 3 3-4 3 6"/></g>
  <circle class="packet second" cx="177" cy="114" r="2" fill="currentColor"/>
  <rect x="233" y="70" width="90" height="77" rx="7" fill="currentColor" fill-opacity=".035" stroke="currentColor" stroke-opacity=".65" stroke-width="1.5"/>
  <rect class="receive" x="244" y="81" width="68" height="55" rx="3" fill="currentColor"/>
  <path d="m253 123 15-18 12 12 10-9 13 15M278 148v16m-21 0h42" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="293" cy="94" r="4" fill="currentColor" fill-opacity=".3"/>
  <path d="M67 188h226" stroke="currentColor" stroke-opacity=".1" stroke-linecap="round"/>
</svg>
