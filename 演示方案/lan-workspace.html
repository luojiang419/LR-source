<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>末帧 · 团队工作台</title><link rel="icon" href="data:,"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/workbench.css"><link rel="stylesheet" href="/assets/reference-search.css"><link rel="stylesheet" href="/assets/lan-workspace.css"></head>
<body class="lan-page">
<section id="login" class="lan-login"><form id="login-form" class="lan-login-card"><span class="lan-brand">F. 末帧</span><h1>团队工作台</h1><p>查看拍摄进度，找到需要的资产。</p><label for="access-code">工作台访问码</label><input id="access-code" type="password" autocomplete="current-password" required maxlength="128" placeholder="由摄影工作站提供"><button class="primary" id="login-submit">进入工作台</button><p id="login-message" role="status">与摄影工作站连接同一局域网即可访问。</p></form></section>
<div id="workspace" class="lan-app" hidden>
<header class="lan-header"><div class="lan-identity"><span class="lan-brand">F. 末帧</span><strong>团队工作台</strong><span class="lan-readonly">同步查阅</span></div>
<nav class="lan-tabs" role="tablist" aria-label="团队工作台"><button id="tab-progress" role="tab" aria-controls="panel-progress" aria-selected="true">拍摄进度</button><button id="tab-search" role="tab" aria-controls="panel-search" aria-selected="false" tabindex="-1">资产检索</button><button id="tab-archive" role="tab" aria-controls="panel-archive" aria-selected="false" tabindex="-1">资产归档</button></nav>
<div id="lan-settings" class="lan-settings"><button id="lan-settings-trigger" type="button" aria-label="工作台设置" title="工作台设置" aria-haspopup="menu" aria-expanded="false" aria-controls="lan-settings-menu"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9.5 3-.6 2.3-2 .9-2.2-.6-2.5 4.3 1.6 1.7v2.3l-1.6 1.7 2.5 4.3 2.2-.6 2 .9.6 2.3h5l.6-2.3 2-.9 2.2.6 2.5-4.3-1.6-1.7v-2.3l1.6-1.7-2.5-4.3-2.2.6-2-.9L14.5 3z"/><circle cx="12" cy="12.8" r="3.3"/></svg></button><div id="lan-settings-menu" class="lan-settings-menu" role="menu" aria-label="工作台操作" hidden><p id="connection" role="status">正在同步…</p><button id="refresh" type="button" role="menuitem">刷新数据</button><button id="theme-cycle" type="button" role="menuitem">切换主题</button><button id="logout" type="button" role="menuitem">退出工作台</button></div></div></header>
<main class="lan-main">
<section id="panel-progress" class="lan-progress-page" role="tabpanel" aria-labelledby="tab-progress">
<div class="lan-progress-workspace">
<div class="lan-progress-main"><button id="progress-sidebar-toggle" class="bordered" type="button" aria-controls="progress-sidebar" aria-expanded="false">查看进度与筛选</button>
<section class="lan-progress-list" aria-label="款号清单"><h3><span>款号清单</span><span id="progress-search-summary" role="status" hidden></span></h3><p class="lan-progress-note">序号按当前列表连续排列，原表行号单独保留。拍摄完成时间与款号图片同步软件端，点击图片或完成时间可查看。</p>
<div class="lan-table-wrap"><table class="lan-progress-table"><thead id="progress-head"></thead><tbody id="progress-rows"></tbody></table><button id="progress-more" class="lan-more bordered" hidden>加载更多款号</button></div></section></div>
<aside id="progress-sidebar" class="lan-progress-sidebar" aria-label="拍摄进度与筛选"><button id="progress-sidebar-close" type="button" class="bordered">收起侧栏</button>
<header class="lan-progress-heading"><h2>拍摄进度</h2><p>只读查看软件端导入的清单与拍摄进度，数据自动同步。</p></header>
<div class="lan-progress-search"><label for="progress-query">查找款号<input id="progress-query" type="search" maxlength="300" aria-label="搜索拍摄款号" placeholder="输入款号快速查找"></label><select id="progress-status" aria-label="拍摄状态筛选"><option value="">全部款号</option><option value="shot">已拍摄</option><option value="pending">未拍摄</option></select></div>
<div class="lan-progress-sidebar-scroll"><nav id="progress-sheets" class="lan-progress-sheets" role="tablist" aria-label="查看拍摄工作表"></nav>
<details class="lan-progress-card" open><summary>拍摄任务与工作表</summary><div class="lan-progress-fields"><label>拍摄任务<select id="project" aria-label="拍摄计划"></select></label><label>查看工作表<select id="sheet" aria-label="查看工作表"><option value="">全部工作表</option></select></label><p id="progress-project-info"></p></div></details>
<details class="lan-progress-card" open><summary>当前页进度</summary><div class="lan-metrics"><div><span>总款数</span><strong id="count-total">0</strong></div><div><span>已拍摄</span><strong id="count-shot">0</strong></div><div><span>未拍摄</span><strong id="count-pending">0</strong></div><div class="lan-progress-meter"><span id="progress-ratio">0% 完成</span><progress id="progress-meter" max="100" value="0" aria-label="当前页完成进度"></progress></div></div></details>
<p id="progress-message" role="status"></p></div></aside></div>
</section>
<section id="panel-search" role="tabpanel" aria-labelledby="tab-search" hidden>

<form id="search-form" class="lan-searchbar"><input id="search-query" type="search" maxlength="300" placeholder="输入 SKU，或描述画面内容…" aria-label="搜索资产"><button id="search-submit" class="primary">搜索</button><label class="lan-filter-root"><span class="lan-sr-only">归档位置</span><select id="search-root" aria-label="归档位置"></select></label><label class="lan-filter-media"><span class="lan-sr-only">素材类型</span><select id="search-media" aria-label="素材类型"><option value="">全部素材</option><option value="image">图片 / RAW</option><option value="video">视频</option><option value="design">设计文件</option></select></label><label class="lan-filter-mode"><span class="lan-sr-only">搜索方式</span><select id="search-mode" aria-label="搜索方式"><option value="index">SKU / 关键词</option><option value="semantic">CLIP 语义搜索</option></select></label></form>

<div class="lan-search-layout"><div class="lan-reference-sidebar"><section id="web-reference" class="lan-reference-panel"></section><aside class="lan-filters"><h3>多维筛选</h3><select id="dimension" aria-label="选择解析维度"></select><div id="facets" class="lan-chips"></div><button id="clear-facets" class="bordered" hidden>清除筛选</button><p>支持拖入图片或 Ctrl+V 粘贴参考图。画面关键词与维度来自工作站已完成的解析。</p></aside></div><div class="lan-results"><p id="search-message" class="lan-result-status" role="status"></p><div id="search-grid" class="lan-grid" role="list" aria-label="资产检索结果"></div><button id="search-more" class="lan-more bordered" hidden>加载更多资产</button></div></div>
</section>
<section id="panel-archive" role="tabpanel" aria-labelledby="tab-archive" hidden>

<form id="archive-form" class="lan-toolbar"><label>归档位置<select id="archive-root"></select></label><input id="archive-query" type="search" maxlength="300" placeholder="搜索文件名、SKU 或资料" aria-label="搜索归档"><select id="archive-media" aria-label="归档素材类型"><option value="">全部素材</option><option value="image">图片 / RAW</option><option value="video">视频</option><option value="design">设计文件</option></select><button class="primary">搜索</button></form>
<nav id="breadcrumbs" class="lan-breadcrumbs" aria-label="当前归档目录"></nav><div id="archive-folders" class="lan-chips lan-folders"></div><p id="archive-message" class="lan-result-status" role="status"></p><div id="archive-grid" class="lan-grid" role="list" aria-label="归档资产"></div><button id="archive-more" class="lan-more bordered" hidden>加载更多资产</button>
</section>
</main><footer class="lan-footer"><span>数据来自摄影工作站 · 只读查阅</span><span id="sync-time">等待同步</span></footer>
</div>
<dialog id="asset-detail" aria-labelledby="detail-title"><header><h2 id="detail-title">资产资料</h2><button id="detail-close" class="bordered" aria-label="关闭资产预览">关闭 ×</button></header><div class="lan-detail-body"><div class="lan-detail-stage"><img id="detail-image" alt="资产大图"></div><aside><p id="detail-status" role="status"></p><div id="detail-content"></div><div class="lan-detail-actions"><button id="detail-similar" class="bordered">查找相似图片</button><button id="detail-sku" class="bordered">检索同款资产</button></div></aside></div></dialog>
<dialog id="progress-image" aria-labelledby="progress-image-title"><header><h2 id="progress-image-title">款号图片</h2><button id="progress-image-close" type="button" class="bordered">关闭 ×</button></header><div class="lan-progress-image-stage"><img id="progress-image-content" alt="款号图片"><p id="progress-image-status" role="status"></p></div></dialog>
<script src="/assets/reference-search.js"></script><script src="/assets/lan-workspace.js"></script></body></html>
